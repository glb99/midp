[project]
name = "midp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "glb99", email = "guillelb99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "google-genai>=2.34.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
midp = "midp:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
